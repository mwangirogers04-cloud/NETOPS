name: NETOPS Cloud API 24/7 Keep-Alive

on:
  schedule:
    # Ping every 10 minutes to keep Render web service awake 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping NETOPS API Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send keep-alive health ping
        run: |
          echo "Pinging NETOPS Cloud API at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://api.netops.co.ke/health")
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "NETOPS Cloud API is healthy and awake."
          else
            echo "Notice: Response status $STATUS"
          fi
